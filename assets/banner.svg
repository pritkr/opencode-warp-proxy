<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d131f" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>

    <!-- Glows -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orangeGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>

    <!-- Shield & Accent Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter for subtle drop shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#cyanGlow)" />
  <rect width="1200" height="360" rx="16" fill="url(#orangeGlow)" />

  <!-- Background Decorative Grid Gridlines -->
  <g stroke="#334155" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Visual Icon: Shield & Network Node (Left Side) -->
  <g transform="translate(110, 75)" filter="url(#dropShadow)">
    <!-- Outer Shield Halo Ring -->
    <circle cx="105" cy="105" r="95" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="6 6" />
    <circle cx="105" cy="105" r="85" fill="#0b1324" stroke="url(#shieldGrad)" stroke-width="3" />
    
    <!-- Shield Icon -->
    <path d="M 105,45 L 155,68 C 155,120 135,148 105,165 C 75,148 55,120 55,68 Z" fill="url(#shieldGrad)" opacity="0.15" />
    <path d="M 105,48 L 150,69 C 150,116 132,143 105,158 C 78,143 60,116 60,69 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="4" stroke-linejoin="round" />

    <!-- Lightning Bolt & Orbit Dots -->
    <path d="M 110,75 L 90,105 L 106,105 L 98,135 L 126,100 L 110,100 Z" fill="url(#boltGrad)" filter="url(#dropShadow)" />
    <circle cx="152" cy="72" r="5" fill="#f97316" />
    <circle cx="58" cy="72" r="4" fill="#38bdf8" />
    <circle cx="105" cy="162" r="4" fill="#38bdf8" />
  </g>

  <!-- Main Titles & Subtitles -->
  <g transform="translate(370, 115)">
    <!-- Tag Pill -->
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-opacity="0.4" stroke-width="1" />
    <text x="14" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">ZERO RATE-LIMIT SHIELD</text>

    <!-- Main Title -->
    <text x="0" y="70" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">OpenCode WARP Proxy</text>

    <!-- Subtitle -->
    <text x="0" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400">
      Bypass Shared Campus Wi-Fi Rate Limits • Dynamic Privacy Shield • Linux &amp; macOS
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 135)">
      <!-- Badge 1: WARP MASQUE -->
      <rect x="0" y="0" width="180" height="34" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="17" r="5" fill="#f97316" />
      <text x="28" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">WARP Port 40000</text>

      <!-- Badge 2: Privoxy Bridge -->
      <rect x="192" y="0" width="190" height="34" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="208" cy="17" r="5" fill="#38bdf8" />
      <text x="220" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Privoxy SOCKS5 8118</text>

      <!-- Badge 3: 1-Click Reset -->
      <rect x="394" y="0" width="170" height="34" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="410" cy="17" r="5" fill="#10b981" />
      <text x="422" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Dynamic IP Reset</text>
    </g>
  </g>
</svg>
